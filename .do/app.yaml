# ──────────────────────────────────────────────────────────────
# DigitalOcean App Platform spec (doctl-compatible)
# Deploy with: doctl apps create --spec .do/app.yaml
# Or update:   doctl apps update <app-id> --spec .do/app.yaml
#
# Architecture:
#   - 1 managed Postgres (db-s-dev-database)
#   - 1 bot worker (no public ingress — internal comms only)
#   - 1 ui service (public HTTPS ingress via DO-managed domain)
#
# Secrets (SECRET scope) must be set via `doctl apps spec`
# or the DO web UI before first deploy:
#   BINANCE_API_KEY, BINANCE_API_SECRET
# ──────────────────────────────────────────────────────────────
name: hydra
region: nyc

features:
  - buildpack-stack=ubuntu-22

services:
  # ── UI: public-facing Next.js dashboard ─────────────────────
  - name: ui
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    source_dir: /
    dockerfile_path: packages/ui/Dockerfile
    github:
      repo: chordsnstrings/claudealphabot
      branch: main
      deploy_on_push: true
    routes:
      - path: /
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: DATABASE_URL
        value: ${hydra-db.DATABASE_URL}
        scope: RUN_TIME
      - key: BOT_INTERNAL_API_URL
        value: http://bot:8080
        scope: RUN_TIME
      - key: STARTING_EQUITY_USD
        value: "5000"
        scope: RUN_TIME
      - key: BOT_MODE
        value: paper
        scope: RUN_TIME

workers:
  # ── Bot: background worker, no public ingress ───────────────
  - name: bot
    instance_count: 1
    instance_size_slug: basic-xxs
    source_dir: /
    dockerfile_path: packages/bot/Dockerfile
    github:
      repo: chordsnstrings/claudealphabot
      branch: main
      deploy_on_push: true
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: BOT_MODE
        value: paper
        scope: RUN_TIME
      - key: BOT_HTTP_PORT
        value: "8080"
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${hydra-db.DATABASE_URL}
        scope: RUN_TIME
      - key: STARTING_EQUITY_USD
        value: "5000"
        scope: RUN_TIME
      - key: LOG_LEVEL
        value: info
        scope: RUN_TIME
      - key: LOG_FORMAT
        value: json
        scope: RUN_TIME
      - key: BINANCE_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: BINANCE_API_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: BINANCE_TESTNET
        value: "true"
        scope: RUN_TIME
      - key: ARTIFACT_PATH
        value: /app/artifacts/validated_config.json
        scope: RUN_TIME

databases:
  - name: hydra-db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
    production: false

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DEPLOYMENT_LIVE
  - rule: DOMAIN_FAILED
